services:
  db:
    image: mysql:8.4
    container_name: encuestas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-encuestas}
      MYSQL_USER: ${MYSQL_USER:-encuestas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-encuestas}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    # El esquema lo aplican las migraciones DbUp al arrancar la aplicación
    # (src/Encuestas.Web/Migrations); el contenedor solo crea la base vacía.
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de pruebas: captura todos los correos y los muestra en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: encuestas-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encuestas-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # La app se conecta al contenedor de MySQL por el nombre del servicio (db).
      ConnectionStrings__Default: "Server=db;Port=3306;Database=${MYSQL_DATABASE:-encuestas};User ID=${MYSQL_USER:-encuestas};Password=${MYSQL_PASSWORD:-encuestas};"
      ASPNETCORE_ENVIRONMENT: Production
      # URL pública con la que se construyen los enlaces de los correos.
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:8080}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseStartTls: "false"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # Claves de Data Protection: sin volumen, cada reinicio cerraría las sesiones e
      # invalidaría los enlaces de correo ya enviados.
      - web-keys:/keys
    # El HEALTHCHECK de la imagen consulta /health/live; /health/ready comprueba además la BD.

volumes:
  db-data:
  web-keys:
